<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Calamar Player</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f6f6f7;font:16px Arial,Helvetica,sans-serif}main{max-width:1050px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{font-size:23px;font-weight:800}small{color:#aeb1bb}.badge{border:1px solid #40434a;border-radius:30px;padding:8px 13px;font-size:12px}h1{font-size:clamp(30px,6vw,50px);margin-bottom:12px}p{line-height:1.6;color:#bfc2ca}video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;margin:18px 0}form{padding:22px;background:#1b1d23;border:1px solid #30333d;border-radius:16px}label{display:block;margin-bottom:10px}input,select,button{font:inherit;padding:14px;border-radius:9px;border:1px solid #4a4e59}input{width:100%;background:#101114;color:white}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}select{background:#101114;color:white}button{background:#dcff5b;color:#101114;font-weight:bold;cursor:pointer}button.secondary{background:#252830;color:white}#status{padding:14px 0;color:#dcff5b;white-space:pre-wrap}footer{margin-top:30px;color:#9499a7;font-size:13px}</style><main><header><div class="brand">CALAMAR <span style="color:#dcff5b">PLAYER</span></div><span class="badge">REPRODUCTOR WEB</span></header><h1>Tu señal. Tu pantalla.</h1><p>Pega el enlace de tu emisión y pulsa reproducir.</p><video id="video" controls playsinline preload="none"></video><form id="form"><label for="url">Enlace de la emisión</label><input id="url" type="password" placeholder="https://servidor/canal.ts" required autocomplete="off" spellcheck="false"><nav><select id="format" aria-label="Formato"><option value="ts">MPEG-TS (.ts)</option><option value="hls">HLS (.m3u8)</option><option value="native">Vídeo nativo</option></select><button>Reproducir</button><button type="button" class="secondary" id="stop">Detener</button><button type="button" class="secondary" id="full">Pantalla completa</button></nav></form><div id="status" role="status" aria-live="polite">Listo para conectar.</div><footer>El enlace permanece en esta pestaña y no se guarda. La reproducción depende de la compatibilidad del dispositivo y del acceso permitido por el servidor.</footer></main><script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script><script>
const video=document.querySelector('#video'),status=document.querySelector('#status');let player=null,watchdog;
function message(t){status.textContent=t}
function stop(){clearTimeout(watchdog);if(player){player.destroy();player=null}video.pause();video.removeAttribute('src');video.load()}
document.querySelector('#stop').onclick=()=>{stop();message('Reproducción detenida.')};document.querySelector('#full').onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>message('No se pudo abrir la pantalla completa.'))};
video.addEventListener('playing',()=>{clearTimeout(watchdog);message('Reproduciendo en directo.')});video.addEventListener('error',()=>message('No se puede reproducir la señal. Comprueba el formato, los códecs y la respuesta del servidor.'));
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();stop();let url;try{url=new URL(document.querySelector('#url').value.trim());if(!['http:','https:'].includes(url.protocol))throw Error()}catch{message('Introduce un enlace HTTP o HTTPS válido.');return}if(location.protocol==='https:'&&url.protocol==='http:'){message('Esta página usa HTTPS y la señal usa HTTP. Chrome bloquea la carga mediante este reproductor. Necesitas un enlace HTTPS válido del proveedor o un servidor intermedio compatible.');return}const type=document.querySelector('#format').value;message('Conectando…');try{if(type==='ts'){if(!window.mpegts||!mpegts.isSupported())throw Error('Este navegador no admite el motor MPEG-TS.');player=mpegts.createPlayer({type:'mpegts',isLive:true,url:url.href});player.on(mpegts.Events.ERROR,()=>{clearTimeout(watchdog);message('No se pudo cargar MPEG-TS. El servidor puede rechazar la conexión o no permitir CORS, o los códecs pueden ser incompatibles.');});player.attachMediaElement(video);player.load();await player.play()}else if(type==='hls'&&window.Hls&&Hls.isSupported()){player=new Hls();player.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){clearTimeout(watchdog);message('Error HLS: no se pudo cargar o decodificar la emisión. Comprueba acceso, CORS y formato.')}});player.loadSource(url.href);player.attachMedia(video);player.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>message('Pulsa reproducir en el vídeo.')))}else{video.src=url.href;await video.play()}if(video.paused)watchdog=setTimeout(()=>message('La señal no ha empezado. Revisa el acceso al servidor y su compatibilidad con navegadores.'),15000)}catch(err){message(err.message||'No se pudo iniciar la reproducción.')}};
</script></html>
